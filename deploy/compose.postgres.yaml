# OpenEntitlement with Postgres: plans, overrides, grants, and the audit trail survive restarts.
#
#   cp deploy/.env.example deploy/.env    # then set real tokens and a database password
#   docker compose -f deploy/compose.postgres.yaml --env-file deploy/.env up -d
#   open http://localhost:8787
#
# The service migrates the oe_* schema on startup and starts with an empty workspace.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oe
      POSTGRES_DB: oe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - oe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oe -d oe"]
      interval: 5s
      timeout: 5s
      retries: 10

  openentitlement:
    image: olivierbelhumeur/openentitlement:${OE_VERSION:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      OE_PROVIDER: postgres
      DATABASE_URL: postgresql://oe:${POSTGRES_PASSWORD}@postgres:5432/oe
      OE_ADMIN_TOKEN: ${OE_ADMIN_TOKEN:?set OE_ADMIN_TOKEN}
      OE_EVAL_TOKEN: ${OE_EVAL_TOKEN:?set OE_EVAL_TOKEN}

volumes:
  oe-postgres:
